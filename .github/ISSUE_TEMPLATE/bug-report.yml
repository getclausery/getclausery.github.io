name: Something does not work
description: A bug in the app, a template, a calculator or the website.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This is public.** Please do not attach real client documents or answers. A description, or a copy with the names changed, is enough.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Use the "Mutual NDA" sample
        3. ...
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Windows 11
  - type: input
    id: version
    attributes:
      label: Clausery version
      description: Shown in the app under Settings → About.
